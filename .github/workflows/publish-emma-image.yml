name: Publish Emma image

# Builds master and publishes it to Emma's registry. Only master can publish:
# the GCP identity behind DEBEZIUM_IMAGE_WORKLOAD_IDENTITY_PROVIDER trusts this
# workflow on refs/heads/master in the debezium-image-publication environment
# (emma-app/infrastructure governance/debezium-image-publication.tf), and that
# environment deploys only from master. The build job has no credential; the
# publish job pushes exactly the image the build job tested.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish, e.g. 0.11.0.final-emma.4. The registry's tags are immutable.
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-emma-image
  cancel-in-progress: false

env:
  IMAGE_NAME: debezium-server-bigquery
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  build:
    if: github.repository == 'emma-app/debezium-server-bigquery' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || "$IMAGE_TAG" == latest ]]; then
            echo "Invalid image tag: $IMAGE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test
        run: mvn -B --no-transfer-progress clean verify -Drevision="$IMAGE_TAG"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # --pull resolves eclipse-temurin:21-jre afresh, so a rebuild of the same
      # commit picks up JDK security fixes.
      - name: Build the image
        run: |
          docker buildx build --pull --platform linux/amd64 \
            --build-arg RELEASE_VERSION="$IMAGE_TAG" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$IMAGE_NAME:$IMAGE_TAG" --load .
          docker image inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Id}}' > image-id
          docker image save "$IMAGE_NAME:$IMAGE_TAG" | gzip > image.tar.gz
          docker run --rm --entrypoint java "$IMAGE_NAME:$IMAGE_TAG" -version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image
          path: |
            image.tar.gz
            image-id
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: debezium-image-publication
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image

      - name: Load the tested image
        run: |
          docker image load --input image.tar.gz
          loaded=$(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Id}}')
          if [[ "$loaded" != "$(cat image-id)" ]]; then
            echo "Loaded image $loaded is not the image the build job tested" >&2
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEBEZIUM_IMAGE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEBEZIUM_IMAGE_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Push
        env:
          REGISTRY: ${{ vars.DEBEZIUM_IMAGE_REGISTRY }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          printf '%s' "$ACCESS_TOKEN" | docker login --username oauth2accesstoken --password-stdin "${REGISTRY%%/*}"
          # One tag per build: a rebuild of the same commit (for a base image fix)
          # gets a new image_tag, and the commit is in the revision label.
          docker image tag "$IMAGE_NAME:$IMAGE_TAG" "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker image push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          digest=$(docker image inspect "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          echo "Published $REGISTRY/$IMAGE_NAME:$IMAGE_TAG as $digest" | tee -a "$GITHUB_STEP_SUMMARY"
